name: Deploy ke GitHub Pages

# Aplikasi ini murni statis — tanpa build step, tanpa dependensi — jadi
# yang dibutuhkan hanya mengunggah folder flowaffiliate/ apa adanya.
on:
  push:
    branches: ["main"]
  workflow_dispatch: {}      # bisa juga dijalankan manual dari tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CATATAN (penyebab run pertama & kedua gagal di langkah ini):
      # configure-pages hanya MEMERIKSA keberadaan situs Pages, dan tidak
      # pernah membuatnya. Opsi `enablement: true` tidak bisa dipakai di sini
      # karena dokumentasi action-nya menyatakan:
      #   "This option requires a token other than GITHUB_TOKEN to be provided."
      # Artinya GITHUB_TOKEN bawaan workflow TIDAK BOLEH mengaktifkan Pages.
      #
      # => Pages harus diaktifkan sekali secara manual oleh pemilik repo:
      #      Settings -> Pages -> Source: "GitHub Actions"
      #    Setelah itu langkah ini akan lolos dengan sendirinya.
      - name: Konfigurasi GitHub Pages
        uses: actions/configure-pages@v5

      - name: Unggah artefak
        uses: actions/upload-pages-artifact@v3
        with:
          path: .          # repo root = root aplikasi statis

      - name: Deploy ke Pages
        id: deployment
        uses: actions/deploy-pages@v4
