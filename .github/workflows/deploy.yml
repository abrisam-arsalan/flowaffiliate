name: Deploy ke GitHub Pages

# Aplikasi ini murni statis — tanpa build step, tanpa dependensi — jadi
# yang dibutuhkan hanya mengunggah folder flowaffiliate/ apa adanya.
on:
  push:
    branches: ["main"]
  workflow_dispatch: {}      # bisa juga dijalankan manual dari tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Konfigurasi GitHub Pages
        uses: actions/configure-pages@v5

      - name: Unggah artefak
        uses: actions/upload-pages-artifact@v3
        with:
          path: .          # repo root = root aplikasi statis

      - name: Deploy ke Pages
        id: deployment
        uses: actions/deploy-pages@v4
